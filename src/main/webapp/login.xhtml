<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HospitalJSF - Iniciar Sesión</title>
    <link rel="stylesheet" href="#{request.contextPath}/resources/css/style.css" />
    <style>
        /* Fondo con gradiente pastel premium idéntico a la plantilla */
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, #E0E7FF 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, #EDE9FE 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, #EEF2FF 0%, #DCE7FE 100%);
            padding: 24px;
            overflow: auto;
        }

        /* Contenedor principal estilo Glass/Tarjeta dividida */
        .login-split-card {
            width: 100%;
            max-width: 980px;
            min-height: 580px;
            background: #FFFFFF;
            border-radius: 36px;
            box-shadow: 0 30px 70px rgba(79, 70, 229, 0.12), 0 10px 25px rgba(19, 102, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.9);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Panel Izquierdo con la fotografía real del Hospital */
        .login-hero-panel {
            width: 44%;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.85) 100%),
                        url('#{request.contextPath}/resources/images/hospital.jpg') center/cover no-repeat;
            padding: 44px 36px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #FFFFFF;
            position: relative;
            overflow: hidden;
        }

        .hero-top {
            position: relative;
            z-index: 2;
        }

        .hero-logo-box {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .hero-slogan {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-subtext {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .hero-footer {
            position: relative;
            z-index: 2;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        /* Panel Derecho del Formulario */
        .login-form-panel {
            width: 56%;
            padding: 44px 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: #FFFFFF;
        }

        .top-language-select {
            position: absolute;
            top: 32px;
            right: 48px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #64748B;
            background: #F8FAFC;
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            cursor: pointer;
        }

        .form-header-title {
            font-size: 26px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Botones de Acceso Rápido estilo Demo / Social (admin / medico) */
        .quick-roles-grid {
            display: flex;
            gap: 12px;
            margin-bottom: 26px;
        }

        .btn-quick-role {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            text-decoration: none;
        }

        .btn-quick-role:hover {
            border-color: #6366F1;
            background: #F5F3FF;
            color: #4F46E5;
            transform: translateY(-1px);
        }

        .btn-quick-role svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* Separador "- OR -" */
        .form-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            color: #94A3B8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .form-divider::before,
        .form-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #F1F5F9;
        }

        .form-divider:not(:empty)::before {
            margin-right: 14px;
        }

        .form-divider:not(:empty)::after {
            margin-left: 14px;
        }

        /* Estilo de Inputs Minimalistas con línea inferior como en la imagen */
        .input-group-clean {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group-clean label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748B;
            margin-bottom: 6px;
        }

        .input-field-underline {
            width: 100%;
            border: none;
            border-bottom: 1.5px solid #E2E8F0;
            padding: 8px 36px 8px 0;
            font-size: 14px;
            font-weight: 600;
            color: #0F172A;
            background: transparent;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-field-underline:focus {
            border-bottom-color: #6366F1;
        }

        .input-field-underline::placeholder {
            color: #94A3B8;
            font-weight: 500;
            font-size: 13px;
        }

        .input-icon-right {
            position: absolute;
            right: 4px;
            bottom: 8px;
            color: #94A3B8;
            cursor: pointer;
        }

        /* Botón de Enviar Violeta Suave como en la imagen */
        .btn-submit-pastel {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
            transition: all 0.25s ease;
        }

        .btn-submit-pastel:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(79, 70, 229, 0.35);
            background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);
        }

        .form-bottom-link {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #64748B;
            font-weight: 600;
        }

        .form-bottom-link a {
            color: #4F46E5;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .form-bottom-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 820px) {
            .login-split-card {
                flex-direction: column;
                max-width: 480px;
            }
            .login-hero-panel {
                width: 100%;
                padding: 32px 24px;
            }
            .login-form-panel {
                width: 100%;
                padding: 36px 28px;
            }
            .hero-art-container {
                display: none;
            }
        }
    </style>
</h:head>
<h:body styleClass="login-page">
    <div class="login-split-card">
        <!-- ================= PANEL IZQUIERDO (Hero y 3D Artwork) ================= -->
        <div class="login-hero-panel">
            <div class="hero-top">
                <div class="hero-logo-box">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M2 12h20M7 7l10 10M17 7L7 17"/>
                    </svg>
                </div>
                <div class="hero-slogan">
                    Portal Hospitalario<br/>Inteligente
                </div>
                <div class="hero-subtext">
                    Gestión integral de pacientes, médicos, diagnósticos y consultas en tiempo real.
                </div>
            </div>

            <div class="hero-footer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                HospitalJSF — Arquitectura Segura por Capas
            </div>
        </div>

        <!-- ================= PANEL DERECHO (Formulario Limpio) ================= -->
        <div class="login-form-panel">
            <div class="top-language-select">
                <span>Español (ES)</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            <div class="form-header-title">Iniciar Sesión</div>

            <!-- Botones de autocompletado rápido estilo Social Buttons de la imagen -->
            <div class="quick-roles-grid">
                <button type="button" class="btn-quick-role" onclick="llenarCredenciales('admin', 'admin123')">
                    <!-- Icono Escudo Admin -->
                    <svg viewBox="0 0 24 24" fill="#4F46E5">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                    </svg>
                    <span>Rol: <b>Admin</b></span>
                </button>

                <button type="button" class="btn-quick-role" onclick="llenarCredenciales('medico', 'medico123')">
                    <!-- Icono Médico -->
                    <svg viewBox="0 0 24 24" fill="#0284C7">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                    </svg>
                    <span>Rol: <b>Médico</b></span>
                </button>
            </div>

            <div class="form-divider">- O INGRESE SUS CREDENCIALES -</div>

            <h:form id="formLogin">
                <!-- Campo: Usuario -->
                <div class="input-group-clean">
                    <label for="txtUsuario">Usuario o Correo Institucional</label>
                    <h:inputText id="txtUsuario" value="#{loginBean.username}"
                                 required="true" requiredMessage="Ingrese su nombre de usuario"
                                 styleClass="input-field-underline"
                                 placeholder="ej. admin o medico" />
                    <div class="input-icon-right">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                </div>

                <!-- Campo: Contraseña -->
                <div class="input-group-clean">
                    <label for="txtClave">Contraseña de Acceso</label>
                    <h:inputSecret id="txtClave" value="#{loginBean.password}"
                                   required="true" requiredMessage="Ingrese su contraseña"
                                   styleClass="input-field-underline"
                                   placeholder="••••••••" />
                    <div class="input-icon-right" onclick="togglePasswordVisibility()" title="Mostrar / ocultar contraseña">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                </div>

                <!-- Botón de Envío -->
                <h:commandButton value="Ingresar al Sistema"
                                 action="#{loginBean.iniciarSesion}"
                                 styleClass="btn-submit-pastel" />

                <!-- Mensajes de Error / Validación JSF -->
                <h:messages styleClass="messages-box" style="margin-top: 18px; text-align: left;" />

                <div class="form-bottom-link">
                    ¿Olvidó sus credenciales? <a href="#">Contactar a Soporte TI</a>
                </div>
            </h:form>
        </div>
    </div>

    <!-- Script para autocompletar credenciales y alternar visibilidad de contraseña -->
    <script>
        function llenarCredenciales(usuario, clave) {
            var inputUser = document.getElementById("formLogin:txtUsuario");
            var inputPass = document.getElementById("formLogin:txtClave");
            if (inputUser &amp;&amp; inputPass) {
                inputUser.value = usuario;
                inputPass.value = clave;
                inputUser.focus();
            }
        }

        function togglePasswordVisibility() {
            var passInput = document.getElementById("formLogin:txtClave");
            if (passInput) {
                if (passInput.type === "password") {
                    passInput.type = "text";
                } else {
                    passInput.type = "password";
                }
            }
        }
    </script>
</h:body>
</html>
